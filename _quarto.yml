project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/basket.jpeg

book:
  title: "Quarto Template"
  author: "Abyan Fathin Pradafi"
  date: today
  description: "Deskripsi singkat tentang buku"
  cover-image: images/cover-e.jpg
  sidebar:
    tools:
      - icon: github
        href: https://github.com/Fathinda/Template_Quarto.git
        text: "Repositori GitHub"
      - icon: file-pdf
        href: Quarto-Template.pdf
        text: "Baca / Unduh PDF"
      - icon: book
        href: Quarto-Template.epub
        text: "Baca / Unduh EPUB"
  chapters:
    - index.qmd
    - chapters/bab-1.qmd
    - chapters/bab-2.qmd
    - chapters/bab-3.qmd
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="author" content="Abyan Fathin Pradafi">
        <script>
          window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        </script>
        <script defer src="/_vercel/insights/script.js"></script>
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
  epub:
    cover-image: images/cover-e.jpg

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
