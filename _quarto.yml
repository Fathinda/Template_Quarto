project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/team.jpeg

book:
  title: "Quarto Template"
  author: "Abyan Fathin Pradafi"
  date: today
  description: "Deskripsi singkat tentang buku"
  cover-image: images/Cover.png
  repo-url: https://github.com/Fathinda/Template_Quarto.git
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - chapters/bab-1.qmd
    - chapters/bab-2.qmd
    - chapters/bab-3.qmd
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="author" content="Abyan Fathin Pradafi">
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
  epub:
    cover-image: images/Cover.png

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
